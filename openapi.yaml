openapi: 3.0.3
info:
  title: Gestionnaire d'usagers
  description: >
    API de gestion d'usagers avec authentification (locale et tierce a venir),
    et systeme RBAC (roles, groupes, permissions) permettant aux services tiers
    de l'ecosysteme de consulter les permissions accordees a un usager.


    **Deux mecanismes d'authentification distincts** :
    - Usagers humains : session opaque (`Authorization: Bearer <jeton>`), obtenue via `POST /auth/login`
    - Services tiers : cle API (`X-API-Key: <cle>`), obtenue via `POST /services`


    **Autorisation** : gestionnaire-usagers se traite lui-meme comme un service
    du systeme RBAC (voir `SelfServiceID` dans le code). Les routes usager
    protegees suivent la regle "self-ou-permission" : un usager peut toujours
    agir sur son propre compte ; agir sur celui d'un autre necessite la
    permission correspondante (typiquement via le role "admin", assignable
    avec `make grant-admin`).
  version: "0.8.0"

servers:
  - url: http://localhost:8080
    description: Environnement de developpement local (docker compose)

tags:
  - name: usagers
    description: Gestion des usagers (CRUD)
  - name: authentification
    description: Connexion, deconnexion, mot de passe
  - name: services
    description: Services tiers de l'ecosysteme
  - name: permissions
    description: Consultation des permissions par les services tiers
  - name: rbac
    description: Gestion administrative des permissions, roles et groupes
  - name: sante
    description: Verification de disponibilite du serveur

paths:
  /health:
    get:
      tags: [sante]
      summary: Verifie que le serveur repond
      security: []
      responses:
        "200":
          description: Le serveur fonctionne
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /users:
    post:
      tags: [usagers]
      summary: Cree un usager, avec sa premiere methode d'authentification
      description: >
        Route ouverte (auto-inscription) -- ne requiert aucune authentification,
        contrairement aux autres routes usager. Seul `auth_method.provider = "local"`
        est accepte pour l'instant : les fournisseurs tiers (Google, Facebook) ne
        sont pas encore verifies cote serveur, et sont donc refuses (501) plutot
        que d'accepter un identifiant tiers non verifie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Usager cree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Ce courriel est deja utilise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Provider tiers reconnu mais pas encore supporte (google, facebook)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags: [usagers]
      summary: Liste tous les usagers
      description: Requiert la permission `users:read:any` (typiquement via le role admin).
      security:
        - SessionAuth: []
      responses:
        "200":
          description: Liste des usagers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [usagers]
      summary: Recupere un usager par ID
      description: >
        Autorise si l'ID correspond a l'usager connecte (son propre profil),
        OU si l'usager connecte possede la permission `users:read:any`.
      security:
        - SessionAuth: []
      responses:
        "200":
          description: L'usager demande
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [usagers]
      summary: Met a jour le nom et le courriel d'un usager
      description: >
        Autorise si l'ID correspond a l'usager connecte, OU si l'usager
        connecte possede la permission `users:write:any`.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Usager mis a jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [usagers]
      summary: Supprime un usager
      description: >
        Autorise si l'ID correspond a l'usager connecte, OU si l'usager
        connecte possede la permission `users:delete:any`.
      security:
        - SessionAuth: []
      responses:
        "204":
          description: Usager supprime
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [authentification]
      summary: Definit le mot de passe local d'un usager
      description: >
        Cree (ou remplace) la methode d'authentification locale de cet usager.
        Autorise si l'ID correspond a l'usager connecte, OU si l'usager
        connecte possede la permission `users:write:any`.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "201":
          description: Methode d'authentification creee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethod"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/permissions:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [permissions]
      summary: Permissions effectives d'un usager, pour le service authentifie
      description: >
        Reservee aux services tiers de l'ecosysteme, authentifies par cle API.
        L'ID du service concerne vient EXCLUSIVEMENT de la cle API fournie --
        jamais d'un parametre de la requete -- donc un service ne peut jamais
        voir les permissions definies par un AUTRE service.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Permissions effectives (directes + via roles + via groupes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/permissions/check:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [permissions]
      summary: Verifie si un usager a UNE permission precise, pour le service authentifie
      description: >
        Raccourci par rapport a GET /users/{id}/permissions : plutot que de
        recuperer toute la liste et chercher soi-meme, un service demande
        directement "cet usager a-t-il CETTE permission ?" -- reponse
        booleenne. Utile pour une verification synchrone avant d'executer
        une action.


        Memes garanties que GET /users/{id}/permissions : l'ID du service
        vient EXCLUSIVEMENT de la cle API, jamais de la requete -- un
        service ne peut donc jamais verifier une permission au nom d'un
        AUTRE service.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: permission
          in: query
          required: true
          description: La cle de permission a verifier (ex. "orders:read").
          schema:
            type: string
      responses:
        "200":
          description: Resultat de la verification (allowed peut etre true ou false -- ce n'est pas une erreur)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckPermissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/login:
    post:
      tags: [authentification]
      summary: Connexion par mot de passe
      description: Verifie les identifiants et cree une nouvelle session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Connexion reussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Courriel ou mot de passe invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [authentification]
      summary: Revoque la session courante
      description: >
        Deconnexion immediate et definitive -- contrairement a un JWT, une
        session opaque peut etre revoquee avant son expiration naturelle.
      security:
        - SessionAuth: []
      responses:
        "204":
          description: Session revoquee
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [usagers]
      summary: Profil de l'usager actuellement connecte
      description: L'ID de l'usager vient de la session, jamais d'un parametre d'URL.
      security:
        - SessionAuth: []
      responses:
        "200":
          description: Le profil de l'usager connecte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /services:
    post:
      tags: [services]
      summary: Cree un service tiers de l'ecosysteme
      description: >
        Requiert la permission `services:create` (typiquement via le role admin).
        Retourne la cle API en clair -- affichee UNE SEULE FOIS, jamais
        recuperable par la suite. A stocker immediatement cote client.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Service cree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      tags: [services]
      summary: Liste tous les services tiers
      description: Requiert la permission `services:manage`. Ne retourne jamais la cle API (meme hachee).
      security:
        - SessionAuth: []
      responses:
        "200":
          description: Liste des services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [services]
      summary: Recupere un service par ID
      description: Requiert la permission `services:manage`. Ne retourne jamais la cle API (meme hachee).
      security:
        - SessionAuth: []
      responses:
        "200":
          description: Le service demande
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [services]
      summary: Modifie le nom et la description d'un service
      description: Requiert la permission `services:manage`. Ne modifie jamais la cle API -- voir POST /services/{id}/rotate-key pour ca.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "200":
          description: Service mis a jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [services]
      summary: Supprime un service
      description: Requiert la permission `services:manage`.
      security:
        - SessionAuth: []
      responses:
        "204":
          description: Service supprime
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /services/{id}/rotate-key:
    post:
      tags: [services]
      summary: Fait pivoter la cle API d'un service, invalidant l'ancienne immediatement
      description: >
        Requiert la permission `services:manage`. Retourne la nouvelle cle
        en clair -- affichee UNE SEULE FOIS, comme a la creation.
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Nouvelle cle API generee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServiceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /permissions:
    post:
      tags: [rbac]
      summary: Cree une permission
      description: Requiert la permission `permissions:manage`.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePermissionRequest"
      responses:
        "201":
          description: Permission creee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      tags: [rbac]
      summary: Liste les permissions d'un service
      description: Requiert la permission `permissions:manage`. Le parametre `service_id` est obligatoire.
      security:
        - SessionAuth: []
      parameters:
        - name: service_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Permissions du service demande
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /permissions/self:
    post:
      tags: [permissions]
      summary: Un service tiers enregistre lui-meme une de ses permissions
      description: >
        Protegee par cle API (X-API-Key), PAS par session usager -- un
        service de l'ecosysteme declare ses propres permissions sans
        intervention d'un admin humain. L'ID du service vient
        EXCLUSIVEMENT de la cle API fournie, jamais du corps de la requete
        -- un service ne peut donc jamais enregistrer une permission au
        nom d'un autre service.


        Idempotente : appeler deux fois avec la meme cle retourne la
        permission existante (200) plutot que d'echouer -- pratique pour
        un enregistrement automatique a chaque demarrage du service.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPermissionRequest"
      responses:
        "200":
          description: La permission existait deja pour ce service -- retournee telle quelle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "201":
          description: Permission creee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /permissions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [rbac]
      summary: Recupere une permission par ID
      security:
        - SessionAuth: []
      responses:
        "200":
          description: La permission demandee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [rbac]
      summary: Supprime une permission
      security:
        - SessionAuth: []
      responses:
        "204":
          description: Permission supprimee
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /roles:
    post:
      tags: [rbac]
      summary: Cree un role
      description: Requiert la permission `roles:manage`.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Role cree (sans permission au depart)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      tags: [rbac]
      summary: Liste tous les roles
      security:
        - SessionAuth: []
      responses:
        "200":
          description: Liste des roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /roles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [rbac]
      summary: Recupere un role par ID (avec ses permissions)
      security:
        - SessionAuth: []
      responses:
        "200":
          description: Le role demande
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [rbac]
      summary: Modifie le nom et la description d'un role
      description: Requiert la permission `roles:manage`. Ne modifie jamais PermissionIDs -- voir POST/DELETE /roles/{id}/permissions pour ca.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "200":
          description: Role mis a jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [rbac]
      summary: Supprime un role
      security:
        - SessionAuth: []
      responses:
        "204":
          description: Role supprime
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /roles/{id}/permissions:
    post:
      tags: [rbac]
      summary: Accorde une permission a un role
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_id]
              properties:
                permission_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Le role mis a jour, avec la nouvelle permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /roles/{id}/permissions/{permissionId}:
    delete:
      tags: [rbac]
      summary: Revoque une permission d'un role
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: permissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Permission revoquee
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /groups:
    post:
      tags: [rbac]
      summary: Cree un groupe
      description: Requiert la permission `groups:manage`.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Groupe cree (vide au depart)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      tags: [rbac]
      summary: Liste tous les groupes
      security:
        - SessionAuth: []
      responses:
        "200":
          description: Liste des groupes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [rbac]
      summary: Recupere un groupe par ID (membres + roles)
      security:
        - SessionAuth: []
      responses:
        "200":
          description: Le groupe demande
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [rbac]
      summary: Modifie le nom et la description d'un groupe
      description: Requiert la permission `groups:manage`. Ne modifie jamais les membres ni les roles -- voir les sous-routes /members et /roles pour ca.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "200":
          description: Groupe mis a jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [rbac]
      summary: Supprime un groupe
      security:
        - SessionAuth: []
      responses:
        "204":
          description: Groupe supprime
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /groups/{id}/members:
    post:
      tags: [rbac]
      summary: Ajoute un membre au groupe
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Le groupe mis a jour, avec le nouveau membre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /groups/{id}/members/{userId}:
    delete:
      tags: [rbac]
      summary: Retire un membre du groupe
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Membre retire
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /groups/{id}/roles:
    post:
      tags: [rbac]
      summary: Assigne un role au groupe (herite par tous ses membres)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Le groupe mis a jour, avec le nouveau role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: Identifiant UUID de l'usager
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Requete invalide (validation echouee)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentification manquante ou invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authentifie, mais permissions insuffisantes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Cle API d'un service tiers, obtenue via POST /services.
    SessionAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Jeton de session opaque (pas un JWT), obtenu via POST /auth/login.
        Envoye dans l'entete "Authorization: Bearer <jeton>".

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Alice Tremblay
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, suspended]
        role_ids:
          type: array
          items:
            type: string
            format: uuid
        permission_ids:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthMethod:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [local, google, facebook]
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    PermissionsResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            type: string
          example: ["orders:read", "orders:write"]

    CheckPermissionResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        permission:
          type: string
          example: "orders:read"
        allowed:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string

    CreateUserRequest:
      type: object
      required: [name, email, auth_method]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        auth_method:
          $ref: "#/components/schemas/AuthMethodRequest"

    AuthMethodRequest:
      type: object
      description: >
        Discriminee par `provider`, qui est OPTIONNEL et vaut "local" par
        defaut si omis -- le cas le plus courant n'a donc pas besoin de le
        preciser. Pour "local", `password` est requis, `provider_user_id`
        ne s'applique pas. Pour "google"/"facebook" (pas encore actives
        cote serveur, voir POST /users), `provider_user_id` serait requis
        a la place de `password`.
      properties:
        provider:
          type: string
          enum: [local, google, facebook]
          default: local
        password:
          type: string
          format: password
          description: Requis si provider = "local" (ou omis). Ignore pour les autres providers.
        provider_user_id:
          type: string
          description: >
            Requis si provider = "google" ou "facebook" (non actif pour
            l'instant). Optionnel/absent pour "local".

    UpdateUserRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    SetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: Jeton de session en clair -- n'apparait que dans cette reponse.
        expires_at:
          type: string
          format: date-time

    Service:
      type: object
      description: Ne contient JAMAIS la cle API, meme hachee -- voir CreateServiceResponse pour la seule reponse qui l'expose.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time

    CreateServiceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    CreateServiceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        api_key:
          type: string
          description: Cle API en clair -- n'apparait que dans cette reponse.

    Permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        key:
          type: string
          example: "orders:read"
        description:
          type: string

    CreatePermissionRequest:
      type: object
      required: [service_id, key]
      properties:
        service_id:
          type: string
          format: uuid
        key:
          type: string
        description:
          type: string

    RegisterPermissionRequest:
      type: object
      required: [key]
      description: Pas de service_id -- toujours celui du service authentifie par cle API.
      properties:
        key:
          type: string
        description:
          type: string

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        permission_ids:
          type: array
          items:
            type: string
            format: uuid

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        member_user_ids:
          type: array
          items:
            type: string
            format: uuid
        role_ids:
          type: array
          items:
            type: string
            format: uuid

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
